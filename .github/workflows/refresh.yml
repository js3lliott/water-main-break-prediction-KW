name: Weekly refresh

# Pulls fresh data from the live sources, rebuilds the warehouse, rescores the
# forecast year and commits the app bundle back to main. The deployed app reads
# that bundle, so this is what keeps it current.
#
# Everything here is reproducible by hand: `make build` runs the same steps.

on:
  schedule:
    # Mondays, 08:17 UTC. Off the hour deliberately -- scheduled workflows
    # cluster at :00 and get queued.
    - cron: "17 8 * * 1"
  workflow_dispatch:
    inputs:
      skip_challenger:
        description: "Skip the LightGBM challenger score"
        type: boolean
        default: false

# One refresh at a time. Not cancel-in-progress: a half-finished run that has
# already written scores should be allowed to finish rather than leave the
# warehouse mid-flight.
concurrency:
  group: weekly-refresh
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[transform,ml,app]"

      - name: Extract from the live sources
        # ArcGIS for the network and its breaks, ECCC for the weather splice.
        # fetch_layer fails loudly on a short read rather than writing a partial
        # extract, so a bad pull stops here instead of reaching the warehouse.
        run: python -m extract.run --dataset all

      - name: Build the warehouse
        working-directory: transform
        # `build`, not `run`: the data tests are the point. A reintroduced join
        # fanout or an as-of bound slipping from `<` to `<=` fails the job.
        run: |
          dbt deps --profiles-dir .
          dbt build --profiles-dir .

      - name: Score the forecast year
        run: |
          if [ "${{ inputs.skip_challenger }}" = "true" ]; then
            python -m ml.score --no-challenger
          else
            python -m ml.score
          fi

      - name: Export the app bundle
        # Refuses to replace the committed bundle with a materially smaller one.
        run: python -m app.export_app_data

      - name: Summarise
        id: summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import duckdb
          con = duckdb.connect("data/warehouse.duckdb", read_only=True)
          one = lambda q: con.sql(q).fetchone()
          breaks, latest = one("select count(*), max(incident_date) from main_marts.fct_break_incident")
          pipes, km = one("select count(*), round(sum(length_km)) from main_marts.dim_pipe")
          year, scored, version = one(
              "select any_value(target_year), count(*), any_value(method_version) "
              "from main_scores.fct_pipe_risk_score "
              "where scored_at = (select max(scored_at) from main_scores.fct_pipe_risk_score)"
          )
          print("## Weekly refresh\n")
          print("| | |\n|---|---|")
          print(f"| Break records | {breaks:,} |")
          print(f"| Latest break | {latest} |")
          print(f"| Pipe segments | {pipes:,} |")
          print(f"| Network length | {km:,.0f} km |")
          print(f"| Scored for | {year} |")
          print(f"| Segments scored | {scored:,} |")
          print(f"| Ranker version | `{version}` |")
          PY

      - name: Commit the refreshed bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data
          if git diff --cached --quiet; then
            echo "Bundle unchanged; nothing to commit."
            exit 0
          fi
          LATEST=$(python -c "
          import duckdb
          con = duckdb.connect('data/warehouse.duckdb', read_only=True)
          print(con.sql('select max(incident_date) from main_marts.fct_break_incident').fetchone()[0])
          ")
          git commit -m "chore: weekly data refresh (breaks through ${LATEST})" \
                     -m "Regenerated by .github/workflows/refresh.yml." \
                     -m "Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>"
          git push

      - name: Report a failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'refresh-failure';
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                        `/actions/runs/${context.runId}`;
            const body = `The weekly refresh failed.\n\n` +
                         `- Run: ${url}\n- Commit: \`${context.sha.slice(0, 7)}\`\n\n` +
                         `The deployed app keeps serving the last good bundle, so this is ` +
                         `stale data rather than an outage. Common causes: the ArcGIS or ` +
                         `ECCC endpoint moved, a dbt data test caught something upstream, or ` +
                         `the extract came back short.`;

            // Comment on the existing issue rather than opening a new one every
            // Monday until someone looks.
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: label,
            });
            if (open.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: 'Weekly data refresh is failing',
                labels: [label], body,
              });
            }
